server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip text assets — the Vite bundle drops ~70% in size
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed Vite assets — cache forever, they're content-addressed
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API → the server container (same name as docker-compose service)
    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket upgrade — Socket.io lives behind the same proxy
    location /socket.io/ {
        proxy_pass http://server:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback — every unknown route serves index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
