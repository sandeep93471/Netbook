<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Netbook — connect with friends and share your stories" />
    <meta property="og:title" content="Netbook - Social Media Platform" />
    <meta property="og:description" content="Connect with friends and share your stories" />
    <meta property="og:image" content="https://netbook-e9243.web.app/favicon.svg" />
    <meta property="og:url" content="https://netbook-e9243.web.app" />
    <meta name="twitter:card" content="summary" />
    <title>Netbook</title>
    <script>
      // Flash-free dark mode — apply .dark before React paints.
      // Reads the redux-persist store (persist:root → ui.mode).
      try {
        const persisted = JSON.parse(localStorage.getItem('persist:root') || '{}')
        const mode = persisted.ui ? JSON.parse(persisted.ui).mode : null
        if (mode === 'dark' || (!mode && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.background = '#18191A'
        }
      } catch (e) { /* default to light */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Dead-app failsafe: if React never mounts (e.g. a cached index.html
      // pointing at chunk files deleted by a newer deploy), reload once for
      // the fresh build — then show a visible fallback instead of white.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root')
          if (root && !root.hasChildNodes()) {
            if (!sessionStorage.getItem('nb-autoreload')) {
              sessionStorage.setItem('nb-autoreload', '1')
              location.reload()
            } else {
              document.body.innerHTML =
                '<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;text-align:center;padding:24px">' +
                '<h2 style="margin:0 0 8px">Netbook failed to load</h2>' +
                '<p style="color:#666;margin:0 0 20px">Please reload the page. If it keeps failing, clear your browser cache.</p>' +
                '<button onclick="location.reload(true)" style="padding:10px 28px;background:#1877F2;color:#fff;border:0;border-radius:10px;font-size:15px;cursor:pointer">Reload</button></div>'
            }
          }
        }, 8000)
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
